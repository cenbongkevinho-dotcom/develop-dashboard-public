<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>项目进度仪表盘（公开镜像）</title>
  <style>
    :root {
      --bg: #0f1115; --panel: #161a22; --text: #e6edf3; --muted: #9aa4b2; --accent: #4f9cf9; --ok: #3fb950; --warn: #d29922; --bad: #f85149;
    }
    body { margin: 0; font: 14px/1.6 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,'PingFang SC','Hiragino Sans GB','Microsoft Yahei','Noto Sans',sans-serif; background: var(--bg); color: var(--text); }
    .container { max-width: 960px; margin: 0 auto; padding: 16px; }
    header { margin: 8px 0 16px; }
    h1 { font-size: 20px; margin: 0 0 6px; }
    .muted { color: var(--muted); font-size: 12px; }
    .card { background: var(--panel); border: 1px solid #262b36; border-radius: 12px; padding: 12px; margin: 12px 0; }
    .list { display: grid; grid-template-columns: 1fr; gap: 8px; }
    @media (min-width: 640px) { .list { grid-template-columns: 1fr 1fr; } }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .bar { height: 8px; background: #222632; border-radius: 999px; overflow: hidden; }
    .bar > span { display: block; height: 100%; background: var(--accent); }
    .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; }
    .ok { background: #243c2a; color: var(--ok); border: 1px solid #335f3f; }
    .doing { background: #2b3443; color: var(--accent); border: 1px solid #3c5578; }
    .todo { background: #332b2b; color: var(--warn); border: 1px solid #624d2d; }
    .fail { background: #3a2626; color: var(--bad); border: 1px solid #613636; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    footer { margin-top: 16px; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>项目进度仪表盘（公开镜像）</h1>
      <div class="muted" id="updated">加载中…</div>
    </header>

    <section class="card">
      <div class="row"><strong>里程碑进度</strong></div>
      <div id="milestones" class="list"></div>
    </section>

    <section class="card">
      <div class="row"><strong>Agent 任务进度</strong></div>
      <div id="agents" class="list"></div>
    </section>

    <section class="card">
      <div class="row"><strong>CI 状态</strong></div>
      <div id="ci" class="list"></div>
    </section>

    <section class="card">
      <div class="row"><strong>快速访问</strong></div>
      <ul>
        <li>仪表盘（Markdown）：<a href="https://github.com/cenbongkevinho-dotcom/develop-dashboard-public/blob/main/docs/project-dashboard.md" target="_blank">打开</a></li>
        <li>数据源（JSON, Raw）：<a href="https://raw.githubusercontent.com/cenbongkevinho-dotcom/develop-dashboard-public/main/docs/dashboard.json" target="_blank">打开</a></li>
        <li>HTML 预览（自动渲染）：<a href="https://htmlpreview.github.io/?https://raw.githubusercontent.com/cenbongkevinho-dotcom/develop-dashboard-public/main/docs/project-dashboard.html" target="_blank">打开</a></li>
      </ul>
    </section>

    <footer>
      说明：此页面为公开镜像，仅包含脱敏后的进度概览与统计，不含任何内部文档或敏感信息。
    </footer>
  </div>

  <script>
    const JSON_URL = 'https://raw.githubusercontent.com/cenbongkevinho-dotcom/develop-dashboard-public/main/docs/dashboard.json';
    const $ = sel => document.querySelector(sel);

    function badge(status) {
      const map = { done: 'ok', in_progress: 'doing', todo: 'todo', fail: 'fail' };
      const cls = map[status] || 'todo';
      const text = { done: '已完成', in_progress: '进行中', todo: '待办', fail: '失败' }[status] || status;
      return `<span class="badge ${cls}">${text}</span>`;
    }

    function milestoneRow(m) {
      const pct = Math.round((m.progress || 0) * 100);
      return `<div class="card">
        <div class="row"><span>${m.name}</span><span>${pct}%</span></div>
        <div class="bar"><span style="width:${pct}%"></span></div>
      </div>`;
    }

    function agentRow(a) {
      return `<div class="row"><span>${a.name}</span><span>${badge(a.status)}</span></div>`;
    }

    function ciRow(k, v) {
      const map = { pass: 'ok', progress: 'doing', fail: 'fail' };
      const text = { pass: '通过', progress: '进行中', fail: '失败' }[v] || v;
      const cls = map[v] || 'todo';
      return `<div class="row"><span>${k}</span><span class="badge ${cls}">${text}</span></div>`;
    }

    async function main() {
      try {
        const res = await fetch(JSON_URL, { cache: 'no-store' });
        const data = await res.json();
        $('#updated').textContent = `数据更新时间：${new Date(data.updated_at).toLocaleString()}`;
        $('#milestones').innerHTML = (data.milestones || []).map(milestoneRow).join('');
        $('#agents').innerHTML = (data.agents || []).map(agentRow).join('');
        $('#ci').innerHTML = Object.entries(data.ci || {}).map(([k,v]) => ciRow(k, v)).join('');
      } catch (e) {
        $('#updated').textContent = '数据加载失败，请稍后重试。';
      }
    }
    main();
  </script>
</body>
</html>
